<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>sky · Data model</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+JP:wght@400;500;600&family=Noto+Serif+JP:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', 'Noto Sans JP', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif JP', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Data model · sky</p>
    <h1>記録・日記のデータモデル</h1>

    <div class="diagram-container">
    <svg viewBox="0 40 960 396" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="data-model-title data-model-desc">
      <title id="data-model-title">記録・日記のデータモデル</title>
      <desc id="data-model-desc">DayEntry がその日の RecordItem を複数持ち、RecordItem は写真ファイルをパスで参照する。DayEntry と RecordItem は SharedPreferences の journal_json に JSON 1つでまとめて保存され、写真は内部ストレージの JPEG ファイルとして残る。</desc>

      <rect x="0" y="40" width="960" height="396" fill="#f5f5f5"/>

      <!-- Zones (bg → zones → relationship lines → labels → nodes) -->
      <rect x="40" y="80" width="648" height="236" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="60" y="100" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans JP', 'Yu Gothic', sans-serif">SharedPreferences: journal_prefs / journal_json（JSON 1つ）</text>

      <rect x="728" y="80" width="192" height="200" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="748" y="100" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans JP', 'Yu Gothic', sans-serif">内部ストレージ</text>

      <!-- Relationships -->
      <line x1="316" y1="208" x2="436" y2="208" stroke="#4f5d75" stroke-width="1"/>
      <line x1="668" y1="208" x2="748" y2="208" stroke="#4f5d75" stroke-width="1"/>

      <!-- Cardinalities and relationship labels -->
      <rect x="324" y="188" width="12" height="12" rx="2" fill="#f5f5f5"/>
      <text x="330" y="197" fill="#4f5d75" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">1</text>

      <rect x="400" y="188" width="28" height="12" rx="2" fill="#f5f5f5"/>
      <text x="414" y="197" fill="#4f5d75" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">0..*</text>

      <rect x="676" y="188" width="28" height="12" rx="2" fill="#f5f5f5"/>
      <text x="690" y="197" fill="#4f5d75" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">0..1</text>

      <rect x="724" y="188" width="12" height="12" rx="2" fill="#f5f5f5"/>
      <text x="730" y="197" fill="#4f5d75" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">1</text>

      <rect x="336" y="216" width="76" height="16" rx="2" fill="#f5f5f5"/>
      <text x="374" y="228" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans JP', 'Yu Gothic', sans-serif" text-anchor="middle">その日の記録</text>

      <rect x="676" y="216" width="64" height="16" rx="2" fill="#f5f5f5"/>
      <text x="708" y="228" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans JP', 'Yu Gothic', sans-serif" text-anchor="middle">パスで参照</text>

      <!-- Entity: DayEntry (focal, aggregate root) -->
      <rect x="60" y="120" width="256" height="176" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
      <rect x="60" y="120" width="256" height="44" rx="6" fill="rgba(191,69,32,0.10)"/>
      <rect x="60" y="156" width="256" height="8" fill="rgba(191,69,32,0.10)"/>
      <line x1="60" y1="164" x2="316" y2="164" stroke="rgba(191,69,32,0.40)" stroke-width="1"/>
      <text x="76" y="136" fill="#bf4520" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.12em">ENTITY · AGGREGATE ROOT</text>
      <text x="76" y="154" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif">DayEntry</text>
      <text x="300" y="154" fill="#4f5d75" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans JP', 'Yu Gothic', sans-serif" text-anchor="end">1日分</text>

      <text x="76" y="184" fill="#2d3142" font-size="9" font-weight="500" font-family="'Geist Mono', monospace"># date</text>
      <text x="118" y="184" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans JP', 'Yu Gothic', sans-serif">日付キー</text>
      <text x="300" y="184" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">String · yyyy-MM-dd</text>

      <text x="76" y="208" fill="#2d3142" font-size="9" font-weight="500" font-family="'Geist Mono', monospace">records</text>
      <text x="124" y="208" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans JP', 'Yu Gothic', sans-serif">記録の一覧</text>
      <text x="300" y="208" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">List&lt;RecordItem&gt;</text>

      <text x="76" y="232" fill="#2d3142" font-size="9" font-weight="500" font-family="'Geist Mono', monospace">diary</text>
      <text x="112" y="232" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans JP', 'Yu Gothic', sans-serif">生成した日記</text>
      <text x="300" y="232" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">String?</text>

      <text x="76" y="256" fill="#2d3142" font-size="9" font-weight="500" font-family="'Geist Mono', monospace">positivity</text>
      <text x="140" y="256" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans JP', 'Yu Gothic', sans-serif">0〜100</text>
      <text x="300" y="256" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">Int?</text>

      <text x="76" y="280" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans JP', 'Yu Gothic', sans-serif">ネガティブ = 100 − positivity</text>

      <!-- Entity: RecordItem -->
      <rect x="436" y="144" width="232" height="128" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="436" y="144" width="232" height="44" rx="6" fill="rgba(45,49,66,0.04)"/>
      <rect x="436" y="180" width="232" height="8" fill="rgba(45,49,66,0.04)"/>
      <line x1="436" y1="188" x2="668" y2="188" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="452" y="160" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.12em">ENTITY</text>
      <text x="452" y="178" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif">RecordItem</text>
      <text x="652" y="178" fill="#4f5d75" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans JP', 'Yu Gothic', sans-serif" text-anchor="end">記録1件</text>

      <text x="452" y="208" fill="#2d3142" font-size="9" font-weight="500" font-family="'Geist Mono', monospace">time</text>
      <text x="482" y="208" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans JP', 'Yu Gothic', sans-serif">記録した時刻</text>
      <text x="652" y="208" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">String · HH:mm</text>

      <text x="452" y="232" fill="#2d3142" font-size="9" font-weight="500" font-family="'Geist Mono', monospace">text</text>
      <text x="482" y="232" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans JP', 'Yu Gothic', sans-serif">会話の1往復 / 写真撮影</text>
      <text x="652" y="232" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">String</text>

      <text x="452" y="256" fill="#2d3142" font-size="9" font-weight="500" font-family="'Geist Mono', monospace">image</text>
      <text x="488" y="256" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans JP', 'Yu Gothic', sans-serif">写真ファイルのパス</text>
      <text x="652" y="256" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">String?</text>

      <!-- Entity: photo file (store) -->
      <rect x="748" y="156" width="152" height="104" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="748" y="156" width="152" height="44" rx="6" fill="rgba(45,49,66,0.06)"/>
      <rect x="748" y="192" width="152" height="8" fill="rgba(45,49,66,0.06)"/>
      <line x1="748" y1="200" x2="900" y2="200" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="764" y="172" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.12em">FILE</text>
      <text x="764" y="190" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans JP', 'Yu Gothic', sans-serif">写真ファイル</text>
      <text x="884" y="190" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">JPEG</text>

      <text x="764" y="220" fill="#2d3142" font-size="9" font-weight="500" font-family="'Geist Mono', monospace">files/journal_images/</text>
      <text x="764" y="244" fill="#2d3142" font-size="9" font-weight="500" font-family="'Geist Mono', monospace">img_&lt;<tspan font-size="12" font-family="'Geist', 'Noto Sans JP', 'Yu Gothic', sans-serif">ミリ秒</tspan>&gt;.jpg</text>

      <!-- Legend strip -->
      <line x1="40" y1="356" x2="920" y2="356" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="372" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="380" width="14" height="10" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
      <text x="62" y="390" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans JP', 'Yu Gothic', sans-serif">中心のエンティティ</text>

      <rect x="196" y="380" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="218" y="390" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans JP', 'Yu Gothic', sans-serif">エンティティ</text>

      <rect x="312" y="380" width="14" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="334" y="390" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans JP', 'Yu Gothic', sans-serif">写真ファイル</text>

      <line x1="432" y1="385" x2="468" y2="385" stroke="#4f5d75" stroke-width="1"/>
      <text x="476" y="390" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans JP', 'Yu Gothic', sans-serif">関連</text>
      <text x="512" y="389" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace">1 : 0..*</text>
    </svg>
    </div>
  </div>
</body>
</html>
