<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>sky · 図形ヒント機能の状態遷移</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+JP:wght@400;500;600&family=Noto+Serif+JP:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', 'Noto Sans JP', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif JP', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">State machine · sky</p>
    <h1>図形ヒント機能の状態遷移</h1>

    <div class="diagram-container">
    <svg viewBox="0 100 960 516" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="state-tutor-title state-tutor-desc">
      <title id="state-tutor-title">図形ヒント機能の状態遷移</title>
      <desc id="state-tutor-desc">Gemini に接続すると見守りを始め、同じ場面が15秒続くと図形問題か判定し、ヒントを提案して、受け入れられたら解析と検証を経てヒントを表示する。断られたときや終了後は休止し、時間が経つと見守りに戻る。</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
      </defs>

      <rect x="0" y="100" width="960" height="516" fill="#f5f5f5"/>

      <!-- Transitions (drawn before states) -->
      <!-- start → IDLE -->
      <line x1="54" y1="176" x2="80" y2="176" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- a1 IDLE → WATCHING -->
      <line x1="208" y1="165" x2="304" y2="165" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- a2 WATCHING → CLASSIFYING -->
      <line x1="432" y1="176" x2="528" y2="176" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- a3 CLASSIFYING → OFFERING -->
      <line x1="656" y1="176" x2="752" y2="176" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- a6 OFFERING → ANALYZING -->
      <line x1="816" y1="208" x2="816" y2="320" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- a8 ANALYZING → HINT_VISIBLE -->
      <line x1="752" y1="352" x2="656" y2="352" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- a10 HINT_VISIBLE self loop -->
      <path d="M 568,320 V 296 Q 568,288 576,288 H 608 Q 616,288 616,296 V 320" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- a11 HINT_VISIBLE → COOLDOWN -->
      <line x1="528" y1="352" x2="432" y2="352" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- a12 COOLDOWN → WATCHING -->
      <line x1="368" y1="320" x2="368" y2="208" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- a9 ANALYZING → ERROR -->
      <line x1="816" y1="384" x2="816" y2="480" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- a7 OFFERING → COOLDOWN (hop over a9 at x=816) -->
      <path d="M 880,176 H 896 Q 904,176 904,184 V 432 Q 904,440 896,440 H 824 a 8,8 0 0,0 -16,0 H 376 Q 368,440 368,432 V 384" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- a13 ERROR → WATCHING -->
      <path d="M 752,512 H 272 Q 264,512 264,504 V 196 Q 264,188 272,188 H 304" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Transition labels (Japanese register: 12px sans 500, 16px masks) -->
      <rect x="240" y="141" width="32" height="16" rx="2" fill="#f5f5f5"/>
      <text x="256" y="153" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans JP', 'Yu Gothic', sans-serif" text-anchor="middle">接続</text>

      <rect x="456" y="152" width="48" height="16" rx="2" fill="#f5f5f5"/>
      <text x="480" y="164" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans JP', 'Yu Gothic', sans-serif" text-anchor="middle">15秒静止</text>
      <rect x="446" y="184" width="68" height="16" rx="2" fill="#f5f5f5"/>
      <text x="480" y="196" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans JP', 'Yu Gothic', sans-serif" text-anchor="middle">新しい場面</text>

      <rect x="676" y="152" width="56" height="16" rx="2" fill="#f5f5f5"/>
      <text x="704" y="164" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans JP', 'Yu Gothic', sans-serif" text-anchor="middle">図形問題</text>
      <rect x="670" y="184" width="68" height="16" rx="2" fill="#f5f5f5"/>
      <text x="704" y="196" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans JP', 'Yu Gothic', sans-serif" text-anchor="middle">0.85 以上</text>

      <rect x="824" y="256" width="68" height="16" rx="2" fill="#f5f5f5"/>
      <text x="858" y="268" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans JP', 'Yu Gothic', sans-serif" text-anchor="middle">受け入れた</text>

      <rect x="678" y="328" width="52" height="16" rx="2" fill="#f5f5f5"/>
      <text x="704" y="340" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans JP', 'Yu Gothic', sans-serif" text-anchor="middle">検証 OK</text>
      <rect x="670" y="360" width="68" height="16" rx="2" fill="#f5f5f5"/>
      <text x="704" y="372" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans JP', 'Yu Gothic', sans-serif" text-anchor="middle">0.80 以上</text>

      <rect x="558" y="264" width="68" height="16" rx="2" fill="#f5f5f5"/>
      <text x="592" y="276" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans JP', 'Yu Gothic', sans-serif" text-anchor="middle">次のヒント</text>

      <rect x="464" y="328" width="32" height="16" rx="2" fill="#f5f5f5"/>
      <text x="480" y="340" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans JP', 'Yu Gothic', sans-serif" text-anchor="middle">終了</text>

      <rect x="292" y="256" width="68" height="16" rx="2" fill="#f5f5f5"/>
      <text x="326" y="268" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans JP', 'Yu Gothic', sans-serif" text-anchor="middle">時間が経過</text>

      <rect x="716" y="408" width="92" height="16" rx="2" fill="#f5f5f5"/>
      <text x="762" y="420" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans JP', 'Yu Gothic', sans-serif" text-anchor="middle">検証 NG・30秒</text>

      <rect x="542" y="448" width="100" height="16" rx="2" fill="#f5f5f5"/>
      <text x="592" y="460" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans JP', 'Yu Gothic', sans-serif" text-anchor="middle">断った（180秒）</text>

      <rect x="474" y="520" width="68" height="16" rx="2" fill="#f5f5f5"/>
      <text x="508" y="532" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans JP', 'Yu Gothic', sans-serif" text-anchor="middle">時間が経過</text>

      <!-- Start dot -->
      <circle cx="48" cy="176" r="6" fill="#2d3142"/>

      <!-- State: IDLE -->
      <rect x="80" y="144" width="128" height="64" rx="8" fill="#f5f5f5"/>
      <rect x="80" y="144" width="128" height="64" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="144" y="174" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans JP', 'Yu Gothic', sans-serif" text-anchor="middle">停止中</text>
      <text x="144" y="192" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">IDLE</text>

      <!-- State: WATCHING -->
      <rect x="304" y="144" width="128" height="64" rx="8" fill="#f5f5f5"/>
      <rect x="304" y="144" width="128" height="64" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="368" y="174" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans JP', 'Yu Gothic', sans-serif" text-anchor="middle">見守り中</text>
      <text x="368" y="192" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">WATCHING</text>

      <!-- State: CLASSIFYING -->
      <rect x="528" y="144" width="128" height="64" rx="8" fill="#f5f5f5"/>
      <rect x="528" y="144" width="128" height="64" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="592" y="174" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans JP', 'Yu Gothic', sans-serif" text-anchor="middle">問題を判定中</text>
      <text x="592" y="192" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">CLASSIFYING</text>

      <!-- State: OFFERING -->
      <rect x="752" y="144" width="128" height="64" rx="8" fill="#f5f5f5"/>
      <rect x="752" y="144" width="128" height="64" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="816" y="174" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans JP', 'Yu Gothic', sans-serif" text-anchor="middle">ヒントを提案中</text>
      <text x="816" y="192" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">OFFERING</text>

      <!-- State: COOLDOWN (waiting) -->
      <rect x="304" y="320" width="128" height="64" rx="8" fill="#f5f5f5"/>
      <rect x="304" y="320" width="128" height="64" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="368" y="350" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans JP', 'Yu Gothic', sans-serif" text-anchor="middle">休止中</text>
      <text x="368" y="368" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">COOLDOWN</text>

      <!-- State: HINT_VISIBLE (focal) -->
      <rect x="528" y="320" width="128" height="64" rx="8" fill="#f5f5f5"/>
      <rect x="528" y="320" width="128" height="64" rx="8" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
      <text x="592" y="350" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans JP', 'Yu Gothic', sans-serif" text-anchor="middle">ヒント表示中</text>
      <text x="592" y="368" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">HINT_VISIBLE</text>

      <!-- State: ANALYZING (focal) -->
      <rect x="752" y="320" width="128" height="64" rx="8" fill="#f5f5f5"/>
      <rect x="752" y="320" width="128" height="64" rx="8" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
      <text x="816" y="350" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans JP', 'Yu Gothic', sans-serif" text-anchor="middle">問題を解析中</text>
      <text x="816" y="368" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ANALYZING</text>

      <!-- State: ERROR -->
      <rect x="752" y="480" width="128" height="64" rx="8" fill="#f5f5f5"/>
      <rect x="752" y="480" width="128" height="64" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="816" y="510" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans JP', 'Yu Gothic', sans-serif" text-anchor="middle">エラー</text>
      <text x="816" y="528" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ERROR</text>

      <!-- Legend strip -->
      <line x1="40" y1="560" x2="920" y2="560" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="576" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="584" width="14" height="10" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
      <text x="60" y="594" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans JP', 'Yu Gothic', sans-serif">中心となる状態</text>

      <rect x="168" y="584" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="188" y="594" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans JP', 'Yu Gothic', sans-serif">状態</text>

      <rect x="236" y="584" width="14" height="10" rx="2" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="256" y="594" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans JP', 'Yu Gothic', sans-serif">待つ状態</text>

      <circle cx="336" cy="589" r="5" fill="#2d3142"/>
      <text x="348" y="594" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans JP', 'Yu Gothic', sans-serif">開始</text>

      <line x1="396" y1="589" x2="424" y2="589" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="432" y="594" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans JP', 'Yu Gothic', sans-serif">遷移（きっかけ）</text>
    </svg>
    </div>
  </div>
</body>
</html>
